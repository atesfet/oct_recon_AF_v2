[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "octrecon"
version = "2.0.0"
description = "GPU (NVIDIA CUDA / Apple MPS) and CPU reconstruction of tiled Thorlabs OCT volumes (Python port of myOCT yOCTProcessTiledScan) with a local web UI"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy", "numba", "tifffile", "imagecodecs", "pyyaml", "matplotlib", "psutil"]

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]
mps = ["torch>=2.3"]
test = ["pytest", "h5py"]

[project.scripts]
octrecon = "octrecon.cli:main"

[tool.setuptools.packages.find]
include = ["octrecon*"]

[tool.setuptools.package-data]
octrecon = ["data/*.dat", "webapp/static/*"]
